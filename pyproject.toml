[project]
name = "animat-agent"
version = "0.1.0"
description = "The agent that lives — An LLM-based embodied artificial organism framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiomqtt>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
animat = "animat.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["animat"]
