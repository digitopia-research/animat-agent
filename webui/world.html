<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animat 世界模拟器 — World Console</title>
<!--
  这是一个独立页面，刻意与 index.html（监控台）分开。

  为什么分开：
    监控台回答"Animat 现在怎么想"——它是观察窗，只读。
    本页回答"我要让世界发生什么"——它是控制台，只写。
    两者混在一屏时，同一个数值既是"读数"又是"输入"，极易误操作，
    且注入事件后很难分辨画面变化是自己造成的还是 Animat 自发的。

  通信：
    发布 animat/env/control  {"cmd":"person"} 之类
    订阅 animat/env/status   状态快照与命令回执
    env_simulator 在后端模式下（stdin 接 /dev/null）靠这条通道接受控制。
-->
<script src="vendor/mqtt.min.js"></script>
<style>
  :root {
    --accent-2: #22d3ee;
    --yellow: #e8b339;
    --red: #e5484d;
    --purple: #8b5cf6;
    --radius: 4px;
    --mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  body[data-resolved="dark"] {
    --bg-0: #07080a;
    --bg-panel: rgba(14, 15, 18, .9);
    --bg-card: rgba(255, 255, 255, .022);
    --bg-inset: rgba(0, 0, 0, .34);
    --txt: #f0f2f6;
    --txt-dim: #9aa3b6;
    --muted: #626b80;
    --accent: #3ddc97;
    --green: #3ddc97;
    --accent-soft: rgba(61, 220, 151, .12);
    --line: rgba(255, 255, 255, .085);
    --line-strong: rgba(255, 255, 255, .16);
    --glow-1: rgba(61, 220, 151, .07);
    --glow-2: rgba(34, 211, 238, .06);
  }
  body[data-resolved="light"] {
    --bg-0: #f7f8fa;
    --bg-panel: rgba(255, 255, 255, .92);
    --bg-card: rgba(15, 23, 42, .022);
    --bg-inset: rgba(15, 23, 42, .035);
    --txt: #12161f;
    --txt-dim: #4a5468;
    --muted: #8791a5;
    --accent: #0a9d63;
    --green: #0a9d63;
    --accent-soft: rgba(10, 157, 99, .09);
    --line: rgba(15, 23, 42, .1);
    --line-strong: rgba(15, 23, 42, .18);
    --glow-1: rgba(10, 157, 99, .07);
    --glow-2: rgba(34, 211, 238, .07);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--sans); color: var(--txt);
    min-height: 100vh;
    background: var(--bg-0);
    background-image:
      radial-gradient(900px 520px at 6% -12%, var(--glow-2), transparent 60%),
      radial-gradient(780px 460px at 96% 4%, var(--glow-1), transparent 58%);
    -webkit-font-smoothing: antialiased;
    letter-spacing: .1px;
    transition: background-color .4s ease;
  }
  ::selection { background: var(--accent-soft); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(125,125,145,.22); border-radius: 0; }

  header {
    padding: 0 22px; min-height: 54px;
    background: var(--bg-panel);
    backdrop-filter: blur(18px) saturate(150%);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px;
    /* 允许换行：竖屏/窄屏下高度固定 54px 会让内容直接溢出到页面外，
       改 min-height + wrap，让顶栏自己长高。 */
    flex-wrap: wrap;
    padding-top: 8px; padding-bottom: 8px;
    position: sticky; top: 0; z-index: 10;
  }
  /* 横屏时仍保持紧凑：只在空间足够时收起上下内边距的影响 */
  @media (min-width: 901px) {
    header { flex-wrap: nowrap; padding-top: 0; padding-bottom: 0; min-height: 54px; }
  }
  header h1 {
    font-size: 12.5px; margin: 0; font-weight: 700; letter-spacing: 2.4px;
    text-transform: uppercase; display: flex; align-items: center; gap: 10px;
    white-space: nowrap;
  }
  header h1 .logo {
    width: 20px; height: 20px; display: grid; place-items: center;
    font-size: 11px; color: var(--accent-2);
    border: 1px solid var(--line-strong); border-radius: 3px;
    box-shadow: inset 0 0 10px rgba(34,211,238,.16);
  }
  header h1 .sub {
    font-weight: 400; font-size: 9.5px; color: var(--muted); letter-spacing: 1.6px;
    padding-left: 12px; margin-left: 2px; border-left: 1px solid var(--line);
  }

  .conn {
    display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: var(--txt-dim);
    padding: 5px 11px; border-radius: 2px; border: 1px solid var(--line);
    letter-spacing: 1.1px; text-transform: uppercase; white-space: nowrap;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); transition: .3s; }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulseDot 2.6s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  input[type="text"] {
    background: var(--bg-inset); border: 1px solid var(--line); color: var(--txt);
    padding: 6px 10px; border-radius: 2px; font-size: 10.5px;
    font-family: var(--mono); transition: .18s;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent-2); }

  button {
    background: transparent; color: var(--accent-2);
    border: 1px solid var(--line-strong); padding: 6px 14px;
    border-radius: 2px; cursor: pointer;
    font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    transition: .18s; font-family: inherit;
  }
  button:hover { border-color: var(--accent-2); background: rgba(34,211,238,.08); }
  button:active { opacity: .7; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.sec { color: var(--txt-dim); border-color: var(--line); }
  button.sec:hover { color: var(--txt); border-color: var(--line-strong); background: var(--bg-card); }
  button.on {
    color: var(--accent); border-color: var(--accent);
    background: var(--accent-soft); font-weight: 700;
  }
  button.danger:hover { color: var(--red); border-color: var(--red); background: rgba(229,72,77,.08); }

  .modes { display: flex; margin-left: auto; align-items: center; }
  .modes .lbl { font-size: 9px; letter-spacing: 1.4px; color: var(--muted); margin-right: 8px; text-transform: uppercase; }

  /* ── 窄屏 / 竖屏适配 ── */
  /* 顶栏元素较多（标题 + 状态 + 地址 + 按钮 + 链接 + 主题）。
     竖屏下按重要性重排：标题占满一行，地址栏吃掉剩余宽度，其余换到第二行。 */
  @media (max-width: 900px) {
    header { gap: 10px; padding: 10px 14px; }

    /* 标题独占一行 */
    header h1 { flex: 1 1 100%; font-size: 11.5px; letter-spacing: 1.8px; }
    /* 竖屏放不下副标题，隐藏；它是装饰性文字，去掉不影响信息 */
    header h1 .sub { display: none; }

    /* 连接状态不再被挤压 */
    .conn { flex: 0 0 auto; }

    /* 地址栏占据第二行剩余空间，最小可读宽度 */
    input[type="text"] { flex: 1 1 130px; min-width: 0; width: auto !important; }

    /* 连接按钮跟地址栏同行 */
    #connectBtn { flex: 0 0 auto; padding: 6px 12px; }

    /* 跳转链接与主题切换换到最后一行 */
    .link-btn { flex: 0 0 auto; }
    .modes { margin-left: 0; flex: 0 0 auto; }
    .modes .lbl { display: none; }
    .mode-btn { padding: 5px 9px; }
  }

  /* 极窄（手机竖屏 < 420px）：进一步压缩内边距与字号 */
  @media (max-width: 420px) {
    header { gap: 8px; padding: 9px 11px; }
    header h1 { font-size: 11px; letter-spacing: 1.4px; }
    .conn { font-size: 9.5px; padding: 4px 8px; letter-spacing: .6px; }
    input[type="text"] { font-size: 10px; padding: 5px 8px; }
    #connectBtn { font-size: 9.5px; letter-spacing: .8px; padding: 5px 9px; }
    .link-btn { font-size: 9.5px; padding: 5px 9px; letter-spacing: .8px; }
    .mode-btn { font-size: 9px; padding: 4px 7px; }
  }
  .mode-btn {
    padding: 5px 11px; font-size: 10px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 0; margin-left: -1px;
  }
  .mode-btn:first-of-type { border-radius: 3px 0 0 3px; margin-left: 0; }
  .mode-btn:last-of-type { border-radius: 0 3px 3px 0; }
  .mode-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); position: relative; z-index: 1; }
  .link-btn {
    text-decoration: none; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--txt-dim); border: 1px solid var(--line); padding: 6px 12px; border-radius: 2px;
    transition: .18s; white-space: nowrap;
  }
  .link-btn:hover { color: var(--accent-2); border-color: var(--accent-2); background: rgba(34,211,238,.08); }

  main {
    max-width: 1180px; margin: 0 auto; padding: 26px 22px 60px;
    display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start;
  }
  /* 竖屏：单列堆叠。右侧状态面板到下面，先操作后观察的顺序更符合直觉 */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; gap: 16px; padding: 16px 14px 44px; }
    /* 单列时 .panel + .panel 的间距会和右列自己的 margin 叠加，这里统一交给 gap */
    main > div > .panel + .panel { margin-top: 16px; }
  }

  .panel {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px 18px;
    backdrop-filter: blur(14px);
  }
  .panel + .panel { margin-top: 20px; }
  .panel h2 {
    font-size: 9px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--muted); margin: 0 0 14px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h2::before { content: ""; width: 1px; height: 9px; background: var(--accent-2); opacity: .8; }
  .panel h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .panel .note {
    font-size: 10.5px; color: var(--muted); line-height: 1.6; margin: -4px 0 14px;
  }

  /* ── 事件注入卡片 ── */
  .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
  /* 窄屏：168px 的下限会让手机上只剩一列，卡片显得过大；降到 136px 争取两列 */
  @media (max-width: 480px) {
    .events-grid { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 8px; }
    .ev-card { padding: 10px 11px; }
    .ev-card .ev-name { font-size: 11.5px; }
  }
  .ev-card {
    text-align: left; padding: 12px 13px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--bg-card);
    color: var(--txt); cursor: pointer; transition: .16s;
    display: flex; flex-direction: column; gap: 5px;
    font-family: inherit; letter-spacing: 0; text-transform: none;
  }
  .ev-card:hover {
    border-color: var(--accent-2);
    background: rgba(34,211,238,.06);
    transform: translateY(-1px);
  }
  .ev-card:active { transform: translateY(0); opacity: .8; }
  .ev-card .ev-name {
    font-size: 12px; font-weight: 600; color: var(--txt);
    display: flex; align-items: center; gap: 7px;
  }
  .ev-card .ev-desc { font-size: 10px; color: var(--muted); line-height: 1.5; }
  .ev-card .ev-topic {
    font-size: 8.5px; font-family: var(--mono); color: var(--muted);
    letter-spacing: .3px; opacity: .75;
  }
  .ev-card .ev-icon {
    width: 18px; height: 18px; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: 3px; font-size: 10px; border: 1px solid var(--line-strong);
  }
  .ev-card.vision .ev-icon { color: var(--accent-2); }
  .ev-card.audio  .ev-icon { color: var(--yellow); }
  .ev-card.touch  .ev-icon { color: var(--green); }
  .ev-card.intero .ev-icon { color: var(--purple); }

  /* ── 场景与开关 ── */
  .scene-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .scene-row button { flex: 1 1 0; min-width: 110px; padding: 10px 8px; }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 0; border-top: 1px solid var(--line);
  }
  .switch-row:first-of-type { border-top: none; }
  .switch-row .sw-label { font-size: 11.5px; color: var(--txt-dim); }
  .switch-row .sw-label small { display: block; font-size: 9.5px; color: var(--muted); margin-top: 3px; }

  /* ── 状态读数 ── */
  .stats { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 13px; }
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; margin-bottom: 8px; color: var(--txt-dim);
  }
  .stat-row:last-child { margin-bottom: 0; }
  .stat-val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--txt); font-size: 11px; }
  .bar { height: 3px; background: rgba(125,125,145,.14); overflow: hidden; margin-top: 5px; border-radius: 0; }
  .bar > span { display: block; height: 100%; background: var(--green); transition: width .5s cubic-bezier(.4,0,.2,1), background .4s; }

  /* ── 回执日志 ── */
  .acklog {
    font-family: var(--mono); font-size: 10px; line-height: 1.75;
    background: var(--bg-inset); border: 1px solid var(--line);
    border-radius: 3px; padding: 8px 10px; max-height: 200px; overflow-y: auto;
  }
  .acklog .ln { display: flex; gap: 7px; padding: 1px 0; animation: fadeSlide .28s ease-out; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .acklog .ln .ts { color: var(--muted); flex: 0 0 auto; font-size: 9px; padding-top: 1px; }
  .acklog .ln .tx { flex: 1; word-break: break-word; }
  .acklog .ln.ok .tx { color: var(--green); }
  .acklog .ln.err .tx { color: var(--red); }
  .acklog .ln.info .tx { color: var(--muted); }

  .empty { color: var(--muted); font-size: 10.5px; }

  /* 顶部一条细的"发送中"提示，避免误以为按钮没响应 */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 18px);
    background: var(--bg-panel); border: 1px solid var(--line-strong);
    padding: 9px 18px; border-radius: 3px; font-size: 11px;
    color: var(--txt); letter-spacing: .4px;
    opacity: 0; pointer-events: none; transition: .22s;
    box-shadow: 0 8px 30px rgba(0,0,0,.28); z-index: 50;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { border-color: rgba(229,72,77,.5); color: var(--red); }
</style>
</head>
<body data-mode="auto" data-resolved="dark">

<header>
  <h1>
    <span class="logo">◎</span>
    World Simulator
    <span class="sub">环境世界 · 手动注入</span>
  </h1>
  <div class="conn">
    <span class="dot" id="connDot"></span>
    <span id="connText">未连接</span>
  </div>
  <input id="broker" value="ws://192.168.1.6:8083/mqtt" title="MQTT WebSocket 地址" style="width:200px">
  <button id="connectBtn">Connect</button>
  <a class="link-btn" href="index.html">← 监控台</a>
  <a class="link-btn" href="body.html">身体 ↗</a>
  <div class="modes">
    <span class="lbl">Mode</span>
    <button class="mode-btn active" data-m="auto">Auto</button>
    <button class="mode-btn" data-m="light">Light</button>
    <button class="mode-btn" data-m="dark">Dark</button>
  </div>
</header>

<main>
  <!-- 左：控制区 -->
  <div>
    <div class="panel">
      <h2>手动注入事件</h2>
      <div class="note">
        点击即刻注入一次。事件会以 <code>animat/sensor/*</code> 的形式进入 Animat 的感官，
        表现为"世界上刚刚发生了一件事"——而不是"有人对它说了句话"。
      </div>
      <div class="events-grid" id="eventGrid"></div>
    </div>

    <div class="panel">
      <h2>场景密度</h2>
      <div class="note">
        控制模拟器<b>自发</b>注入随机事件的频率。手动注入不受此限制。
      </div>
      <div class="scene-row" id="sceneRow"></div>
    </div>

    <div class="panel">
      <h2>自动事件</h2>
      <div class="switch-row">
        <div class="sw-label">
          世界自己运转
          <small>关闭后只保留昼夜与内感上报，不再随机发生事件</small>
        </div>
        <button id="toggleEvents" class="sec">—</button>
      </div>
      <div class="switch-row">
        <div class="sw-label">
          连接到 Animat
          <small id="bridgeHint">当前状态未知</small>
        </div>
        <button id="toggleBridge" class="sec">—</button>
      </div>
    </div>
  </div>

  <!-- 右：状态与回执 -->
  <div>
    <div class="panel">
      <h2>模拟器状态</h2>
      <div class="stats">
        <div class="stat-row"><span>场景</span><span class="stat-val" id="stScene">—</span></div>
        <div class="stat-row"><span>事件开关</span><span class="stat-val" id="stEvents">—</span></div>
        <div class="stat-row"><span>时令</span><span class="stat-val" id="stPhase">—</span></div>
        <div class="stat-row"><span>光照</span><span class="stat-val" id="stLight">—</span></div>
        <div class="stat-row"><span>底噪</span><span class="stat-val" id="stDb">—</span></div>
        <div class="stat-row"><span>人类活动</span><span class="stat-val" id="stActivity">—</span></div>
        <div class="stat-row"><span>倾角</span><span class="stat-val" id="stTilt">—</span></div>
        <div class="stat-row"><span>认知负载</span><span class="stat-val" id="stLoad">—</span></div>
        <div class="stat-row"><span>已发事件</span><span class="stat-val" id="stCount">—</span></div>
        <div class="stat-row"><span>最近</span><span class="stat-val" id="stLast" style="font-size:10px;text-align:right;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span></div>
      </div>
    </div>

    <div class="panel">
      <h2>回执</h2>
      <div class="acklog" id="ackLog"><span class="empty">（暂无命令）</span></div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
// ───────── 话题（与 animat/config.py 对齐）─────────
const TOPIC = {
  ENV_CONTROL: "animat/env/control",
  ENV_STATUS:  "animat/env/status",
};

// ───────── 可选事件 ─────────
// 每一项对应 env_simulator 里 __doc__ 列出的一个交互命令。
// 这张表只是"按钮清单"，真正的行为由后端命令决定，前端不解释任何语义。
const EVENTS = [
  { cmd: "person", name: "有人经过", icon: "◉", cls: "vision",
    desc: "一个人走到近处并看向它", topic: "animat/sensor/vision" },
  { cmd: "leave",  name: "人走开了", icon: "○", cls: "vision",
    desc: "视野里重新空下来", topic: "animat/sensor/vision" },
  { cmd: "touch",  name: "被轻轻碰触", icon: "✋", cls: "touch",
    desc: "低压 + 电容，像被摸了一下", topic: "animat/sensor/touch" },
  { cmd: "bump",   name: "身体被撞", icon: "⚡", cls: "intero",
    desc: "轻碰导致车身晃了两下", topic: "animat/sensor/interoception" },
  { cmd: "light",  name: "光线突变", icon: "☀", cls: "vision",
    desc: "周围突然变亮或变暗", topic: "animat/sensor/vision" },
  { cmd: "noise",  name: "环境异响", icon: "♪", cls: "audio",
    desc: "远处传来一阵声响", topic: "animat/sensor/audio" },
];

const SCENE_LABELS = {
  quiet:  { name: "安静", sub: "仓库 · 20~35 分钟一次" },
  normal: { name: "日常", sub: "室内 · 3~5 分钟一次" },
  lively: { name: "热闹", sub: "集市 · 40~90 秒一次" },
};

let client = null;
let lastStatus = null;
let statusAt = 0;

// ───────── 元素 ─────────
const $ = (id) => document.getElementById(id);
const grid = $("eventGrid");
const sceneRow = $("sceneRow");
const ackLog = $("ackLog");
const toastEl = $("toast");

// ───────── 小工具 ─────────
let toastTimer = null;
function toast(msg, bad) {
  toastEl.textContent = msg;
  toastEl.classList.toggle("bad", !!bad);
  toastEl.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function stamp() {
  const d = new Date();
  return [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, "0")).join(":");
}

function ack(msg, cls) {
  const ph = ackLog.querySelector(".empty");
  if (ph) ph.remove();
  const div = document.createElement("div");
  div.className = "ln " + (cls || "info");
  div.innerHTML = `<span class="ts">${stamp()}</span><span class="tx">${
    String(msg).replace(/</g, "&lt;")}</span>`;
  ackLog.appendChild(div);
  while (ackLog.childElementCount > 80) ackLog.removeChild(ackLog.firstChild);
  ackLog.scrollTop = ackLog.scrollHeight;
}

// ───────── 发布命令 ─────────
// 分三步各自留痕，出问题时能一眼看出卡在哪：
//   1. 连接状态   2. publish 调用是否抛错   3. 回调是否确认发出
function send(cmd, arg) {
  if (!client) {
    toast("尚未建立连接", true);
    ack("✖ 未创建 client（connect 未执行）", "err");
    return false;
  }
  if (!client.connected) {
    toast("未连接 broker，命令未发送", true);
    ack("✖ client.connected = false，命令未发送", "err");
    return false;
  }

  const payload = { cmd: cmd };
  if (arg !== undefined) payload.arg = arg;
  const body = JSON.stringify(payload);

  try {
    client.publish(TOPIC.ENV_CONTROL, body, { qos: 1 }, (err) => {
      // mqtt.js 的 publish 回调带 err 参数：能报错说明 broker 层拒绝了
      if (err) {
        ack("✖ publish 失败: " + err.message, "err");
        toast("发布失败: " + err.message, true);
      }
    });
  } catch (e) {
    ack("✖ publish 抛异常: " + e.message, "err");
    toast("发布异常: " + e.message, true);
    return false;
  }

  ack(`→ 已发出 ${TOPIC.ENV_CONTROL} ${body}`, "info");
  return true;
}

// ───────── 事件按钮 ─────────
EVENTS.forEach(ev => {
  const b = document.createElement("button");
  b.className = "ev-card " + ev.cls;
  b.dataset.cmd = ev.cmd;
  b.innerHTML =
    `<span class="ev-name"><span class="ev-icon">${ev.icon}</span>${ev.name}</span>`
    + `<span class="ev-desc">${ev.desc}</span>`
    + `<span class="ev-topic">${ev.topic}</span>`;
  b.onclick = () => {
    if (send(ev.cmd)) toast("已发送：" + ev.name);
  };
  grid.appendChild(b);
});

// ───────── 场景按钮 ─────────
Object.keys(SCENE_LABELS).forEach(key => {
  const s = SCENE_LABELS[key];
  const b = document.createElement("button");
  b.className = "sec";
  b.dataset.scene = key;
  b.innerHTML = `${s.name}<br><span style="font-size:8.5px;letter-spacing:.5px;color:var(--muted);text-transform:none;display:block;margin-top:3px">${s.sub}</span>`;
  b.onclick = () => {
    if (send("scene", key)) toast("场景 → " + s.name);
  };
  sceneRow.appendChild(b);
});

// ───────── 自动事件开关 ─────────
$("toggleEvents").onclick = function () {
  if (!lastStatus) { toast("尚未收到模拟器状态", true); return; }
  const next = !lastStatus.events_enabled;
  if (send(next ? "lively" : "quiet")) {
    toast(next ? "恢复自动事件" : "暂停自动事件");
  }
};

// ───────── 连接 Animat ─────────
// env_simulator 本身不具备"停/停连 Animat"的命令，这里没有对应的远端能力，
// 因此按钮明确置灰并说明原因，而不是做一个点了没反应的假开关。
$("toggleBridge").disabled = true;
$("toggleBridge").textContent = "常开";
$("bridgeHint").textContent =
  "模拟器进程即世界本身；停掉它请用脚本的 stop，而不是这里";

// ───────── 状态渲染 ─────────
function renderStatus(s) {
  lastStatus = s;
  statusAt = Date.now();

  $("stScene").textContent = s.scene_label || s.scene || "—";
  $("stEvents").textContent = s.events_enabled ? "开" : "暂停";
  $("stEvents").style.color = s.events_enabled ? "var(--green)" : "var(--yellow)";
  $("stPhase").textContent = s.phase || "—";

  if (s.ambient_light != null) {
    const lv = Number(s.ambient_light);
    $("stLight").textContent = lv.toFixed(2) + (lv > 0.6 ? " ☀" : lv > 0.25 ? " ⛅" : " ☾");
  }
  if (s.ambient_db != null) $("stDb").textContent = Number(s.ambient_db).toFixed(0) + " dB";
  if (s.activity != null) $("stActivity").textContent = Number(s.activity).toFixed(2);

  // 电量与体温由 body.html 负责，本页不再显示，
  // 避免出现两处读数不一致的情况。
  if (s.imu_tilt_deg != null) $("stTilt").textContent = Number(s.imu_tilt_deg).toFixed(1) + "°";
  if (s.load != null) $("stLoad").textContent = Number(s.load).toFixed(2);
  if (s.event_count != null) $("stCount").textContent = s.event_count + " 次";
  if (s.last_event) {
    $("stLast").textContent = s.last_event;
    $("stLast").title = s.last_event;
  }

  // 场景按钮高亮
  sceneRow.querySelectorAll("button").forEach(b => {
    const on = b.dataset.scene === s.scene;
    b.classList.toggle("on", on);
    b.classList.toggle("sec", !on);
  });

  // 自动事件按钮
  const te = $("toggleEvents");
  te.textContent = s.events_enabled ? "运行中" : "已暂停";
  te.classList.toggle("on", !!s.events_enabled);
  te.classList.toggle("sec", !s.events_enabled);
}

// 状态超时提示：env_simulator 每 3 秒广播一次，
// 超过 15 秒没收到就说明它挂了或断线了，这时按钮点击是无效的。
setInterval(() => {
  if (!lastStatus) return;
  const stale = Date.now() - statusAt > 15000;
  $("connText").textContent = stale ? "模拟器离线" : "已连接";
  $("connDot").classList.toggle("ok", !stale);
}, 2000);

// ───────── MQTT ─────────
function setConn(ok, msg) {
  $("connDot").classList.toggle("ok", ok);
  $("connText").textContent = msg;
}

function connect() {
  const url = $("broker").value.trim();
  if (!url) { ack("✖ broker 地址为空", "err"); return; }
  if (typeof mqtt === "undefined") {
    ack("✖ mqtt.js 未加载，检查 vendor/mqtt.min.js", "err");
    return;
  }
  if (client) { try { client.end(true); } catch (e) {} }
  setConn(false, "连接中…");
  ack("正在连接 " + url + " …", "info");

  client = mqtt.connect(url, {
    clientId: "animat-world-" + Math.random().toString(16).slice(2),
    // 连不上时不要无限沉默：10 秒内没建立就报错，否则用户只看到"连接中…"
    connectTimeout: 10000,
    reconnectPeriod: 3000,
  });

  client.on("connect", () => {
    setConn(true, "已连接");
    ack("✔ 已连接 broker", "ok");
    client.subscribe([TOPIC.ENV_STATUS], { qos: 0 }, (err) => {
      if (err) ack("✖ 订阅状态话题失败: " + err.message, "err");
      else ack("已订阅 " + TOPIC.ENV_STATUS + "，等待模拟器状态…", "info");
    });
    // 主动 ping 一次，避免连上后要等 3 秒才有第一份状态
    send("status");
  });

  client.on("error", (e) => {
    setConn(false, "错误");
    ack("✖ 连接错误: " + (e && e.message ? e.message : e), "err");
  });
  client.on("close", () => setConn(false, "已断开"));
  client.on("reconnect", () => { setConn(false, "重连中…"); });
  client.on("offline", () => { setConn(false, "离线"); });

  client.on("message", (topic, payload) => {
    if (topic !== TOPIC.ENV_STATUS) return;
    let data;
    try { data = JSON.parse(payload.toString()); } catch (e) { return; }

    if (data.type === "ack") {
      ack((data.ok ? "✔ " : "✖ ") + (data.msg || data.cmd || ""), data.ok ? "ok" : "err");
      if (!data.ok) toast(data.msg || "命令失败", true);
      return;
    }
    renderStatus(data);
  });
}

$("connectBtn").onclick = connect;

// ───────── 显示模式 ─────────
const MODE_KEY = "animat_world_mode";
const MODES = ["auto", "light", "dark"];
const mql = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;

let store = (function () {
  try {
    localStorage.setItem("__w", "1"); localStorage.removeItem("__w");
    return {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };
  } catch (e) {
    const mem = Object.create(null);
    return { get: (k) => mem[k] ?? null, set: (k, v) => { mem[k] = v; } };
  }
})();

let currentMode = "auto";

function resolveMode(m) {
  if (m === "light" || m === "dark") return m;
  if (mql) return mql.matches ? "light" : "dark";
  const h = new Date().getHours();
  return (h >= 7 && h < 19) ? "light" : "dark";
}

function applyMode(mode, persist) {
  if (!MODES.includes(mode)) mode = "auto";
  currentMode = mode;
  document.body.dataset.mode = mode;
  document.body.dataset.resolved = resolveMode(mode);
  document.querySelectorAll(".mode-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.m === mode));
  if (persist) store.set(MODE_KEY, mode);
}

document.querySelectorAll(".mode-btn").forEach(b => {
  b.onclick = () => applyMode(b.dataset.m, true);
});
if (mql) {
  const onChange = () => { if (currentMode === "auto") applyMode("auto", false); };
  if (mql.addEventListener) mql.addEventListener("change", onChange);
  else if (mql.addListener) mql.addListener(onChange);
}
applyMode(store.get(MODE_KEY) || "auto", false);

// 自动连接：本页是操作台，打开就是为了马上动手，不该再点一次
connect();
</script>
</body>
</html>
